name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: lebazare-manager/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: lebazare-manager
        run: npm ci

      - name: Generate native project
        working-directory: lebazare-manager
        run: npx expo prebuild --clean --platform android

      - name: Build APK (release + debug)
        working-directory: lebazare-manager/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: LeBazare-Manager-release
          path: lebazare-manager/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: LeBazare-Manager-debug
          path: lebazare-manager/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
